plugin_configs:
  - id: 1
    plugins:
      openid-connect:
        client_id: "365615904601407492"
        client_secret: "${{APISIX_CLIENT_SECRET}}"
        discovery: "http://zitadel:8080/.well-known/openid-configuration"
        introspection_endpoint: "http://zitadel:8080/oauth/v2/introspect"
        set_access_token_header: false
        set_id_token_header: false
        bearer_only: true
      grpc-transcode:
        proto_id: "user_proto"
        service: "user.v1.UserService"
        method: "GetUserInfo"

routes:
  - uri: /api/v1/hello
    name: "zitadel-openfga-route"
    methods: ["GET", "POST"]
    plugin_config_id: 1
    upstream:
      type: roundrobin
      scheme: grpc
      nodes:
        "service_b:50052": 1

protos:
  - id: "user_proto"
    content: |
      syntax = "proto3";
      package user.v1;
      service UserService {
        rpc GetUserInfo (UserRequest) returns (UserResponse);
      }
      message UserRequest { string id = 1; }
      message UserResponse { string message = 2; string tenant_id = 3; }

#END